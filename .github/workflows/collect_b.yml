name: Disney Wait Time Collector (B) - :30

# 2系列分散: B 系列は毎時 :30 に実行。A 系列が :00 を担当。
# GitHub Actions の cron スキップに対する冗長化。

on:
  schedule:
    - cron: "30 0-13 * * *"     # JST 9:30, 10:30, ..., 22:30
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run collector
        env:
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/collect.py
