name: Keep Alive

# GitHub Actions の仕様で、60日間 commit がないと scheduled workflow が
# 自動的に無効化される。これを防ぐため、毎月 1 回 自動 commit を入れる。
# 参考: https://docs.github.com/en/actions/using-workflows/disabling-and-enabling-a-workflow

on:
  schedule:
    # 毎月 1 日 00:15 UTC (JST 09:15) に実行
    - cron: "15 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump timestamp file
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last_run.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: keep-alive bump"
            git push
          fi
