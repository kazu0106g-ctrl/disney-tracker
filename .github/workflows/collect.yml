name: Disney Wait Time Collector

on:
  schedule:
    # JST 9:00〜22:00 の間、15分おきに実行
    # GitHub Actions の cron は UTC 指定（JST = UTC+9）
    # UTC  0:00〜13:00 = JST 9:00〜22:00
    - cron: "0,15,30,45 0-13 * * *"

  # 手動実行ボタン（テスト用）
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. リポジトリをチェックアウト ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python セットアップ ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. 依存パッケージのインストール ──
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. スクリプト実行 ──
      - name: Run collector
        env:
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/collect.py
