name: Disney Wait Time Collector (A) - :00

# 2系列分散: A 系列は毎時 :00 に実行。B 系列が :30 を担当。
# GitHub Actions の cron スキップに対する冗長化。

on:
  schedule:
    - cron: "0 0-13 * * *"      # JST 9:00, 10:00, ..., 22:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run collector
        env:
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/collect.py
